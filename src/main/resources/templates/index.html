<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Java Tube Converter</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #222; color: #fff; text-align: center; padding-top: 50px; }
        .container { background-color: #333; max-width: 600px; margin: 0 auto; padding: 40px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        h1 { color: #ff0000; margin-bottom: 10px; }
        p.subtitle { color: #aaa; margin-bottom: 30px; }
        input[type="text"] { width: 90%; padding: 15px; margin-bottom: 20px; border: none; border-radius: 5px; font-size: 16px; }
        select { width: 95%; padding: 15px; margin-bottom: 20px; border: none; border-radius: 5px; font-size: 16px; background: #fff; }
        button { background-color: #cc0000; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; transition: 0.3s; width: 100%; font-weight: bold; }
        button:hover { background-color: #ff3333; }
        .alert { background-color: #28a745; color: white; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎸 Java Tube Converter</h1>
    <p class="subtitle">Baixe áudios do YouTube sem anúncios</p>

    <div th:if="${mensagem}" class="alert">
        <span th:text="${mensagem}"></span>
    </div>

    <form action="/converter" method="post">
        <input type="text" name="url" placeholder="Cole a URL do YouTube aqui..." required>

        <select name="quality">
            <option value="128K">128 kbps (MP3 Leve)</option>
            <option value="192K" selected>192 kbps (Qualidade Padrão)</option>
            <option value="256K">256 kbps (Alta Qualidade)</option>
        </select>

        <button type="submit">BAIXAR AGORA 🤘</button>
    </form>
</div>

</body>
</html>
